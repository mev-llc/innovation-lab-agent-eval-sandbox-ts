  <text x="110" y="382" font-size="11" fill="#BB4E17" opacity=".9">×5, a different query each time</text>

  <g font-size="11">
    <circle cx="48" cy="414" r="8" fill="none" stroke="currentColor" stroke-opacity=".6"/>

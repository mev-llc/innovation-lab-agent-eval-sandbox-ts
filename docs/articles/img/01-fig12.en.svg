  <marker id="wbG" viewbox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BB4E17" fill-opacity=".4"/></marker>
 </defs>
 <g font-family="JetBrains Mono, ui-monospace, monospace" fill="currentColor">


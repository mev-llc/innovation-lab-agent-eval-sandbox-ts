<svg xmlns="http://www.w3.org/2000/svg" style="color:#10201C" viewBox="0 0 900 452" role="img" aria-label="System diagram: a tool call, a non-existent edge between two workers, and a repeated search"><rect x="0.0" y="0.0" width="900.0" height="452.0" fill="#FFFFFF"/>
 <defs>
  <marker id="wbA" viewbox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>

  <text x="677" y="186" font-size="12.5" text-anchor="middle">calc_agent</text>
  <rect x="205" y="312" width="165" height="40" rx="4" fill="none" stroke="currentColor" stroke-opacity=".45"/>
  <text x="287" y="337" font-size="12.5" text-anchor="middle">search_docs</text>
  <rect x="612" y="312" width="132" height="40" rx="4" fill="none" stroke="currentColor" stroke-opacity=".45"/>
  <text x="678" y="337" font-size="12.5" text-anchor="middle">calc</text>

  <line x1="425" y1="70" x2="322" y2="155" stroke="currentColor" stroke-opacity=".45" marker-end="url(#wbA)"/>
  <line x1="510" y1="70" x2="638" y2="155" stroke="currentColor" stroke-opacity=".45" marker-end="url(#wbA)"/>
  <line x1="287" y1="204" x2="287" y2="309" stroke="currentColor" stroke-opacity=".6" marker-end="url(#wbA)"/>
  <line x1="678" y1="204" x2="678" y2="309" stroke="currentColor" stroke-opacity=".3" marker-end="url(#wbA)"/>

  <path d="M205,332 L140,332 L140,181 L182,181" fill="none" stroke="#BB4E17" stroke-opacity=".85" marker-end="url(#wbS)"/>

  <line x1="393" y1="181" x2="587" y2="181" stroke="#BB4E17" stroke-opacity=".35" stroke-dasharray="2 6" marker-start="url(#wbG)" marker-end="url(#wbG)"/>
  <circle cx="535" cy="181" r="9" fill="#EDF1EF"/>
  <path d="M530,176 L540,186 M540,176 L530,186" stroke="#BB4E17" stroke-width="1.6"/>
  <text x="490" y="224" font-size="11" text-anchor="middle" fill="#BB4E17">no such edge</text>
  <text x="490" y="240" font-size="11" text-anchor="middle" fill="#BB4E17" opacity=".75">a cycle if you add it</text>

  <circle cx="307" cy="258" r="10" fill="#EDF1EF" stroke="currentColor" stroke-opacity=".6"/>

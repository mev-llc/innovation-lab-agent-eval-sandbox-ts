<svg xmlns="http://www.w3.org/2000/svg" style="color:#10201C" viewBox="0 0 900 592" role="img" aria-label="Повний шлях BM25: обернений індекс будується один раз, а на запиті кожне слово отримує вагу"><rect x="0.0" y="0.0" width="900.0" height="592.0" fill="#FFFFFF"/><defs><marker id="dg" viewbox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><g font-family="JetBrains Mono, ui-monospace, monospace" fill="currentColor"><text x="40" y="22" font-size="10" letter-spacing="1.2" opacity=".5">ІНДЕКСАЦІЯ · ОДИН РАЗ, ЗАЗДАЛЕГІДЬ</text><rect x="40" y="34" width="132" height="40" rx="4" fill="none" stroke="currentColor" stroke-opacity=".45"/><text x="106.0" y="58.0" font-size="12" text-anchor="middle">59 чанків</text><line x1="176" y1="54" x2="214" y2="54" stroke="currentColor" stroke-opacity=".5" marker-end="url(#dg)"/><rect x="218" y="34" width="168" height="40" rx="4" fill="none" stroke="currentColor" stroke-opacity=".45"/><text x="302.0" y="58.0" font-size="11" text-anchor="middle">розбити на окремі слова</text><line x1="390" y1="54" x2="428" y2="54" stroke="currentColor" stroke-opacity=".5" marker-end="url(#dg)"/><rect x="432" y="34" width="200" height="40" rx="4" fill="none" stroke="currentColor" stroke-opacity=".45"/><text x="532.0" y="58.0" font-size="11" text-anchor="middle">скласти обернений індекс</text><text x="40" y="104" font-size="11" opacity=".6">обернений індекс — для кожного слова: у яких чанках і скільки разів; це факти про текст, балів тут немає</text><text x="60" y="128" font-size="11.5" opacity=".8">delivery</text><text x="150" y="128" font-size="11" opacity=".45">→</text><text x="176" y="128" font-size="11.5" opacity=".6">sla#1: 4,  payment#2: 2,  pickup#4: 2  …</text><text x="760" y="128" font-size="11" opacity=".45">17 чанків</text><text x="60" y="150" font-size="11.5" opacity=".8">kg</text><text x="150" y="150" font-size="11" opacity=".45">→</text><text x="176" y="150" font-size="11.5" opacity=".6">tariffs#1: <tspan fill="#BB4E17">5</tspan>,  packaging#1: 4,  tariffs#2: 1</text><text x="760" y="150" font-size="11" opacity=".45">3 чанки</text><text x="60" y="172" font-size="11.5" opacity=".8">8</text><text x="150" y="172" font-size="11" opacity=".45">→</text><text x="176" y="172" font-size="11.5" opacity=".6">tariffs#1: 1</text><text x="760" y="172" font-size="11" opacity=".45">1 чанк</text><line x1="40" y1="212" x2="860" y2="212" stroke="currentColor" stroke-opacity=".15"/><text x="40" y="238" font-size="10" letter-spacing="1.2" opacity=".5">ЗАПИТ · ЩОРАЗУ ЗАНОВО</text><text x="40" y="266" font-size="12" opacity=".8">"How much does domestic delivery of an 8 kg parcel cost?"</text><line x1="60" y1="276" x2="60" y2="300" stroke="currentColor" stroke-opacity=".5" marker-end="url(#dg)"/><text x="76" y="292" font-size="11" opacity=".55">розбиваємо тими самими правилами</text><text x="196" y="326" font-size="10" letter-spacing="1" text-anchor="end" opacity=".5">СЛОВО ЗАПИТУ</text><text x="470" y="326" font-size="10" letter-spacing="1" opacity=".5">ВАГА</text><text x="556" y="326" font-size="10" letter-spacing="1" opacity=".5">ЧАНКІВ</text><text x="196" y="354" font-size="11.5" text-anchor="end">8</text><rect x="210" y="342" width="236" height="14" rx="2" fill="#BB4E17" fill-opacity=".85"/><text x="470" y="354" font-size="11.5" opacity=".75">3,69</text><text x="560" y="354" font-size="11.5" opacity=".55">1</text><text x="600" y="354" font-size="11" fill="#BB4E17" opacity=".9">рідкісне — на ньому й тримається пошук</text><text x="196" y="380" font-size="11.5" text-anchor="end">cost · does</text><rect x="210" y="368" width="203" height="14" rx="2" fill="currentColor" fill-opacity=".4"/><text x="470" y="380" font-size="11.5" opacity=".75">3,18</text><text x="560" y="380" font-size="11.5" opacity=".55">2</text><text x="196" y="406" font-size="11.5" text-anchor="end">kg</text><rect x="210" y="394" width="182" height="14" rx="2" fill="#BB4E17" fill-opacity=".85"/><text x="470" y="406" font-size="11.5" opacity=".75">2,84</text><text x="560" y="406" font-size="11.5" opacity=".55">3</text><text x="600" y="406" font-size="11" fill="#BB4E17" opacity=".9">рідкісне — на ньому й тримається пошук</text><text x="196" y="432" font-size="11.5" text-anchor="end">domestic</text><rect x="210" y="420" width="153" height="14" rx="2" fill="currentColor" fill-opacity=".4"/><text x="470" y="432" font-size="11.5" opacity=".75">2,39</text><text x="560" y="432" font-size="11.5" opacity=".55">5</text><text x="196" y="458" font-size="11.5" text-anchor="end">an</text><rect x="210" y="446" width="125" height="14" rx="2" fill="currentColor" fill-opacity=".4"/><text x="470" y="458" font-size="11.5" opacity=".75">1,95</text><text x="560" y="458" font-size="11.5" opacity=".55">8</text><text x="196" y="484" font-size="11.5" text-anchor="end">parcel</text><rect x="210" y="472" width="100" height="14" rx="2" fill="currentColor" fill-opacity=".4"/><text x="470" y="484" font-size="11.5" opacity=".75">1,57</text><text x="560" y="484" font-size="11.5" opacity=".55">12</text><text x="600" y="484" font-size="11" fill="currentColor" opacity=".5">часте — важить мало</text><text x="196" y="510" font-size="11.5" text-anchor="end">delivery · of</text><rect x="210" y="498" width="79" height="14" rx="2" fill="currentColor" fill-opacity=".4"/><text x="470" y="510" font-size="11.5" opacity=".75">1,23</text><text x="560" y="510" font-size="11.5" opacity=".55">17</text><text x="600" y="510" font-size="11" fill="currentColor" opacity=".5">часте — важить мало</text><text x="196" y="544" font-size="11.5" text-anchor="end" opacity=".45">how · much</text><text x="210" y="544" font-size="11" opacity=".45">—</text><text x="470" y="544" font-size="11.5" opacity=".45">—</text><text x="560" y="544" font-size="11.5" opacity=".55">0</text><text x="600" y="544" font-size="11" opacity=".5">у корпусі немає — у сумі не бере участі</text><line x1="40" y1="564" x2="860" y2="564" stroke="currentColor" stroke-opacity=".15"/><text x="40" y="586" font-size="11.5" opacity=".7">вага слова × насичена кількість входжень (із поправкою на довжину) → сума по словах → top-3</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" style="color:#10201C" viewBox="0 0 900 430" role="img" aria-label="Повний шлях векторного пошуку: чанк і запит ідуть в одну модель з різними префіксами"><rect x="0.0" y="0.0" width="900.0" height="430.0" fill="#FFFFFF"/><defs><marker id="dg" viewbox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="ds" viewbox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BB4E17"/></marker></defs><g font-family="JetBrains Mono, ui-monospace, monospace" fill="currentColor"><text x="40" y="22" font-size="10" letter-spacing="1.2" opacity=".5">ІНДЕКСАЦІЯ · ОДИН РАЗ</text><rect x="40" y="34" width="104" height="40" rx="4" fill="none" stroke="currentColor" stroke-opacity=".45"/><text x="92.0" y="58.0" font-size="12" text-anchor="middle">чанк</text><line x1="148" y1="54" x2="186" y2="54" stroke="currentColor" stroke-opacity=".5" marker-end="url(#dg)"/><rect x="190" y="34" width="168" height="40" rx="4" fill="none" stroke="currentColor" stroke-opacity=".45"/><text x="274.0" y="58.0" font-size="11" text-anchor="middle">"passage: " + text</text><line x1="362" y1="54" x2="400" y2="54" stroke="currentColor" stroke-opacity=".5" marker-end="url(#dg)"/><rect x="404" y="34" width="356" height="40" rx="4" fill="none" stroke="currentColor" stroke-opacity=".45"/><text x="452" y="58" font-size="12">e5-small</text><text x="596" y="58" font-size="11" opacity=".55">→</text><text x="620" y="58" font-size="12">384 числа</text><text x="404" y="90" font-size="11" opacity=".5">вектори нормалізовані: |v| = 1,0000</text><line x1="40" y1="98" x2="860" y2="98" stroke="currentColor" stroke-opacity=".15"/><text x="40" y="124" font-size="10" letter-spacing="1.2" opacity=".5">ЗАПИТ · ЩОРАЗУ</text><rect x="40" y="136" width="104" height="40" rx="4" fill="none" stroke="currentColor" stroke-opacity=".45"/><text x="92.0" y="160.0" font-size="12" text-anchor="middle">запит</text><line x1="148" y1="156" x2="186" y2="156" stroke="currentColor" stroke-opacity=".5" marker-end="url(#dg)"/><rect x="190" y="136" width="168" height="40" rx="4" fill="none" stroke="#BB4E17" stroke-opacity=".85"/><text x="274.0" y="160.0" font-size="11" text-anchor="middle">"query: " + text</text><line x1="362" y1="156" x2="400" y2="156" stroke="currentColor" stroke-opacity=".5" marker-end="url(#dg)"/><rect x="404" y="136" width="356" height="40" rx="4" fill="none" stroke="currentColor" stroke-opacity=".45"/><text x="452" y="160" font-size="12">e5-small</text><text x="596" y="160" font-size="11" opacity=".55">→</text><text x="620" y="160" font-size="12">384 числа</text><text x="404" y="192" font-size="11" fill="#BB4E17" opacity=".9">та сама модель, ті самі ваги — лише префікс інший, бо e5 асиметрична</text><line x1="40" y1="200" x2="860" y2="200" stroke="currentColor" stroke-opacity=".15"/><text x="40" y="226" font-size="10" letter-spacing="1.2" opacity=".5">ПОРІВНЯННЯ · СКАЛЯРНИЙ ДОБУТОК</text><text x="40" y="256" font-size="11.5" opacity=".75">запит</text><text x="150" y="256" font-size="11.5" opacity=".6">[  0,034  −0,051  −0,051  −0,036   0,022  … ]</text><text x="40" y="286" font-size="11.5" opacity=".75">tariffs#1</text><text x="150" y="286" font-size="11.5" opacity=".6">[ −0,018  −0,041  −0,055  −0,050   0,074  … ]</text><text x="530" y="286" font-size="12.5" fill="#BB4E17" opacity=".95">0,8522</text><text x="612" y="286" font-size="11" opacity=".55">правильна відповідь</text><text x="40" y="316" font-size="11.5" opacity=".75">pickup#3</text><text x="150" y="316" font-size="11.5" opacity=".6">[ −0,027  −0,018   0,007  −0,035   0,024  … ]</text><text x="530" y="316" font-size="12.5" fill="currentColor" opacity=".95">0,8454</text><text x="612" y="316" font-size="11" opacity=".55">не та, але поруч</text><text x="40" y="364" font-size="11.5" opacity=".7">вектори нормалізовані, тож косинус — це просто сума добутків по 384 вимірах</text><line x1="40" y1="386" x2="860" y2="386" stroke="currentColor" stroke-opacity=".15"/><text x="40" y="412" font-size="11.5" fill="#BB4E17" opacity=".9">різниця між правильним і хибним — 0,007 на всю задачу</text></g></svg>